name: campaign-engine

x-backend-build: &backend-build
  context: .
  dockerfile: deploy/docker/Dockerfile.backend

x-worker-build: &worker-build
  context: .
  dockerfile: deploy/docker/Dockerfile.worker

x-worker-defaults: &worker-defaults
  build: *worker-build
  env_file: .env
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  restart: unless-stopped
  networks: [campaign-net]

# Shared filesystem for import files: backend-api writes GUI uploads and
# reads/checksums server-drop files; worker-ingestion reads both to run the
# actual streaming stage/commit pipeline out-of-process from the API.
x-import-storage-volumes: &import-storage-volumes
  volumes:
    - import_uploads:/var/lib/campaign-engine/imports/uploads
    - /data/campaign/incoming:/data/campaign/incoming

services:
  # --- Infrastructure (containerized; Postgres and Kannel are existing host
  # services reached directly via their LAN IPs, never containerized here) ---

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Africa/Dar_es_Salaam
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [campaign-net]
    # No published host port: Redis is internal-only (requirements doc §38 -
    # "do not expose internal Kafka/Redis ports publicly"). Also avoids
    # colliding with the host's own existing redis-server on 6379.

  kafka:
    image: apache/kafka:3.8.0
    environment:
      TZ: Africa/Dar_es_Salaam
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: dp4BQLq6aVSS2nBu-ePH2w
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [campaign-net]
    # No published host port: this host already runs an unrelated Kafka
    # container on 9092 - and per security requirements, Kafka should never
    # be exposed publicly anyway. Only campaign-engine services on
    # campaign-net can reach it, as kafka:9092.

  kafka-init:
    image: apache/kafka:3.8.0
    entrypoint: ["/bin/bash", "/scripts/bootstrap-kafka-topics.sh"]
    environment:
      TZ: Africa/Dar_es_Salaam
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./deploy/scripts/bootstrap-kafka-topics.sh:/scripts/bootstrap-kafka-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks: [campaign-net]
    restart: "no"

  # --- One-shot migration job ---

  migrate:
    build: *backend-build
    env_file: .env
    entrypoint: ["/opt/venv/bin/python", "-m", "alembic", "upgrade", "head"]
    working_dir: /app
    networks: [campaign-net]
    restart: "no"

  # --- Control plane ---

  backend-api:
    build: *backend-build
    env_file: .env
    <<: *import-storage-volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks: [campaign-net]
    # No published host port: reached only through nginx.

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    environment:
      TZ: Africa/Dar_es_Salaam
    depends_on:
      - backend-api
    restart: unless-stopped
    networks: [campaign-net]
    # No published host port: reached only through nginx.

  nginx:
    image: nginx:1.27-alpine
    environment:
      TZ: Africa/Dar_es_Salaam
    volumes:
      - ./deploy/nginx/simba.afyacall.co.tz.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/derrick/afyacall:/etc/nginx/certs:ro
    ports:
      - "5674:443"
    depends_on:
      - backend-api
      - frontend
    restart: unless-stopped
    networks: [campaign-net]

  # --- Workers. worker-ingestion and worker-outbox-relay run real logic as
  # of Phase 2 (consuming campaign.import.events / relaying the
  # transactional outbox); the rest remain Phase-1 stub loops proving
  # connectivity + heartbeat until their phase lands - see
  # docs/architecture.md and app/workers/stub_runner.py. ---

  worker-ingestion:
    <<: [*worker-defaults, *import-storage-volumes]
    environment:
      WORKER_TYPE: ingestion

  worker-audience:
    <<: *worker-defaults
    environment:
      WORKER_TYPE: audience

  worker-rotation:
    <<: *worker-defaults
    environment:
      WORKER_TYPE: rotation

  worker-dispatch-sms:
    <<: *worker-defaults
    environment:
      WORKER_TYPE: dispatch-sms

  worker-dispatch-ivr:
    <<: *worker-defaults
    environment:
      WORKER_TYPE: dispatch-ivr

  worker-dispatch-doctor:
    <<: *worker-defaults
    environment:
      WORKER_TYPE: dispatch-doctor

  worker-message-events:
    <<: *worker-defaults
    environment:
      WORKER_TYPE: message-events

  worker-retry-scheduler:
    <<: *worker-defaults
    environment:
      WORKER_TYPE: retry-scheduler

  worker-outbox-relay:
    <<: *worker-defaults
    environment:
      WORKER_TYPE: outbox-relay

  worker-analytics:
    <<: *worker-defaults
    environment:
      WORKER_TYPE: analytics

  worker-scheduler:
    <<: *worker-defaults
    environment:
      WORKER_TYPE: scheduler

networks:
  campaign-net:
    driver: bridge

volumes:
  redis_data:
  kafka_data:
  import_uploads:
