# AfyaCall Campaign Engine - production Nginx config.
# TLS terminates here; everything behind this is internal-only Docker network
# traffic. Certs are the real, existing AfyaCall wildcard cert/key, mounted
# read-only from the host at /home/derrick/afyacall/.

# Only set Connection: upgrade when the client actually asked for a
# websocket/upgrade - otherwise this would break keep-alive on every normal
# HTTP request proxied to the frontend.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name simba.afyacall.co.tz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name simba.afyacall.co.tz;

    # Re-resolve backend-api/frontend via Docker's embedded DNS (127.0.0.11)
    # every 10s instead of once at nginx startup. Without this, nginx caches
    # the upstream container's IP indefinitely - the next time that
    # container is recreated (a normal deploy/restart, not a failure) nginx
    # keeps sending traffic to the dead IP and every request 502s until
    # nginx itself is restarted. Using a variable in proxy_pass is what
    # forces nginx to actually consult the resolver per the configured TTL
    # rather than resolving once at config load.
    resolver 127.0.0.11 valid=10s;

    ssl_certificate     /etc/nginx/certs/afyacall.co.tz.crt;
    ssl_certificate_key /etc/nginx/certs/afyacall.co.tz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Secure headers (requirements doc §35/§38).
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Large CSV/TXT base uploads (17M+ row files) - tune per observed real
    # upload sizes once Phase 2 ingestion is live.
    client_max_body_size 2048m;

    # Import processing itself is asynchronous by design (the upload endpoint
    # returns an import_id immediately and the portal polls status), so these
    # timeouts are a safety margin, not load-bearing for a 17M-row
    # request/response cycle.
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location /api/ {
        # No trailing slash on the proxy_pass target: the FastAPI app's own
        # api_v1_prefix already includes "/api/v1", so the full original
        # path must reach it unchanged rather than have "/api/" stripped.
        # Variable form (see `resolver` above) forces per-TTL re-resolution.
        set $backend_upstream http://backend-api:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Avoid buffering issues on long-running/async import status polling
        # and any future streaming responses.
        proxy_buffering off;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev/HMR + any future websocket use.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
